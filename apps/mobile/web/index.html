<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="GROCERRA - Fresh groceries and catering, delivered to you.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="customer">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>GROCERRA</title>
  <link rel="manifest" href="manifest.json">
<!-- Matches the dark splash so the page never flashes white while the app loads. -->
  <meta name="theme-color" content="#0A0B0A">
  <style>html, body { background: #0A0B0A; margin: 0; }</style>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script>
    // iOS Safari scrolls the page to reveal a focused text field, but the
    // app already lifts its layout above the keyboard. The two together push
    // the screen off the top (e.g. the code boxes vanish on Verify). Undo the
    // browser's scroll so only the app's adjustment applies.
    (function () {
      var reset = function () {
        if (window.scrollX !== 0 || window.scrollY !== 0) window.scrollTo(0, 0);
        if (document.documentElement.scrollTop) document.documentElement.scrollTop = 0;
        if (document.body.scrollTop) document.body.scrollTop = 0;
      };
      var settle = function () {
        reset();
        requestAnimationFrame(reset);
        setTimeout(reset, 120);
        setTimeout(reset, 350);
      };
      window.addEventListener('scroll', reset, { passive: true });
      window.addEventListener('focusin', settle);
      if (window.visualViewport) {
        window.visualViewport.addEventListener('resize', settle);
        window.visualViewport.addEventListener('scroll', settle);
      }
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
